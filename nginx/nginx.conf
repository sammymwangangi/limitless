events {
    worker_connections 1024;
}

http {
    # Rate limiting zone for contact form
    limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=5r/m;

    upstream nextjs_app {
        server nextjs_app:3000;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name limitlesssolutions.co.ke www.limitlesssolutions.co.ke;

        # Certbot ACME challenge passthrough
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name limitlesssolutions.co.ke www.limitlesssolutions.co.ke;

        ssl_certificate     /etc/letsencrypt/live/limitlesssolutions.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/limitlesssolutions.co.ke/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Contact API — rate limited
        location /api/contact {
            limit_req zone=contact_limit burst=3 nodelay;
            proxy_pass http://nextjs_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static assets — long-lived cache
        location ~* \.(js|css|woff2|woff|ttf|ico|svg|png|jpg|jpeg|webp)$ {
            proxy_pass http://nextjs_app;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # All other requests
        location / {
            proxy_pass http://nextjs_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
